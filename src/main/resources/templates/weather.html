<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>天気予報｜FarmView</title>
	
	<style>
		.weather-table {
			border-collapse: collapse;
		}
		
		.weather-table th,.weather-table td {
			border: 1px solid #ccc;
			padding: 12px 20px;
		}
		
		.weather-table th {
			background-color: #e8f5e9;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<h1>天気予報</h1>
	<p>
		気温：
		<span th:text="${temperature}">--</span>℃
	</p>
	
	<p>
		降水確率：
		<span th:text="${rainProbability}">--</span>％
	</p>
	
	<p>
		湿度：
		<span th:text="${humidity}">--</span>％
	</p>
	
	<p>
		降水量：
		<span th:text="${precipitation}">--</span>mm
	</p>
	
	<p>
		風速：
		<span th:text="${windSpeed}">--</span>km/h
	</p>
	
	<h2>今後5時間の降水確率・風速</h2>
	
	<table class="weather-table">
		<tr>
			<th>時刻</th>
			<th>降水確率</th>
			<th>風速</th>
		</tr>
		
		<tr th:each="time, stat : ${forecastTimes}">
			<td th:text="${time}"></td>
			<td>
				<span th:text="${rainProbabilities[stat.index]}"></span>%
			</td>
			<td>
				<span th:text="${windSpeeds[stat.index]}"></span>km/h
			</td>
		</tr>
	</table>
	
	<a href="/">ホームに戻る</a>
</body>
</html>
